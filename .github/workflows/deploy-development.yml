name: Deploy to Firebase Hosting on push to development

on:
  push:
    branches:
      - development

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build Project
        run: npm run build
        
      - name: Deploy to Firebase Preview Channel
        run: npx firebase-tools hosting:channel:deploy development --project intelleskill-website
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
